name: Site

# The landing page in docs/. Deploys on its own, not with the product: a typo in the
# pricing table should never wait on a release, and a release should never wait on it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # No `enablement: true` here — it looks like it would save the one-time setup, but
      # GITHUB_TOKEN cannot create a Pages site even with `pages: write`:
      # "Create Pages site failed. Error: Resource not accessible by integration".
      # Pages was turned on once via the API (POST /repos/{o}/{r}/pages, build_type=workflow);
      # from then on this action only reads the config, which the job token can do.
      - uses: actions/configure-pages@v6

      - name: Upload docs/
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
