name: Site

# The landing page in docs/. Deploys on its own, not with the product: a typo in the
# pricing table should never wait on a release, and a release should never wait on it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # `enablement` turns Pages on the first time this runs, so nobody has to click through
      # Settings. Without it the action fails with "Get Pages site failed... Not Found", which is
      # a red X on a public repo that reads as "this project is broken".
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload docs/
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
