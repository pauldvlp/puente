name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    # main is rebase-only, so every commit on a PR lands verbatim — lint each one.
    # Linting the PR title instead would check a string rebase never turns into a commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the commits this PR adds
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 runs the toolchain. The published package still supports Node >= 20,
      # which the smoke job proves against the real tarball.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm comes from corepack, pinned by `packageManager` in package.json — no
      # third-party action in the path. The second setup-node is what wires up the
      # store cache: `cache: pnpm` shells out to pnpm, so pnpm must exist by then.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Build first: @puente/shared must emit its .d.ts before tsc can resolve it
      # (server & web import @puente/shared, which is only typed via its built dist).
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # E2E: the built server serving the built SPA, against a fresh data dir. Chromium
      # only; no Cloudflare involved, so no secrets.
      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Pack the published package
        working-directory: apps/server
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: puente-tarball
          path: ${{ runner.temp }}/puente-*.tgz
          retention-days: 3

  smoke:
    name: Smoke — runtime on Node ${{ matrix.node }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Non-EOL only. Node 20 is EOL (2026-04-30); test the floor (22) + current (24).
        node: [22, 24]
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: puente-tarball
          path: pkg

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install the tarball into a clean project and run the CLI
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/pkg/puente-*.tgz

          # The version the CLI reports must be the version npm serves. These drifted
          # apart once already (0.1.0 reported while 0.2.0 shipped), and the smoke job
          # printed it without ever comparing it.
          expected="$(node -p "require('$workdir/node_modules/puente/package.json').version")"
          actual="$(./node_modules/.bin/puente --version)"
          echo "manifest=$expected  cli=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::puente --version says $actual but the published manifest says $expected"
            exit 1
          fi

          echo "— puente info —"
          ./node_modules/.bin/puente info

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # buildx is what makes `cache-from: type=gha` and `load: true` work together.
      - uses: docker/setup-buildx-action@v4

      # The compose file is how a lot of people will run puente, and until now nothing
      # checked that it still builds. It rotted onto EOL node:20 unnoticed for months.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: puente:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The runtime must not be EOL
        run: |
          set -euo pipefail
          major="$(docker run --rm --entrypoint node puente:ci --version | sed 's/^v\([0-9]*\).*/\1/')"
          echo "container runs Node $major"
          [ "$major" -ge 22 ] || { echo "::error::image runs EOL Node $major"; exit 1; }

      - name: Start it and serve the panel
        run: |
          set -euo pipefail
          docker run -d --name puente-ci -p 5006:5006 puente:ci
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5006/ || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "::error::panel never answered (last status ${code:-none})"; docker logs puente-ci; exit 1; }
          # A fresh container must report first-run state and the real version.
          curl -sf http://127.0.0.1:5006/api/setup/status | tee /dev/stderr | grep -q '"hasAdmin":false'
          docker rm -f puente-ci >/dev/null
